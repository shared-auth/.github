name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues, pull requests, and documentation.
          required: true
        - label: I removed credentials, private data, and customer information.
          required: true
  - type: input
    id: repository
    attributes:
      label: Target repository
      placeholder: owner/repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and users affected
      description: Describe the outcome needed rather than only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include compatibility, security, operations, and migration implications.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion and validation criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
    validations:
      required: false
