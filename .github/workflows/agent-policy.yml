name: Agent policy reusable check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-auth-agent-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate policy, workflow pins, conflict markers, and credential patterns
        shell: bash
        run: bash scripts/validate-agent-policy.sh
      - name: Exercise fail-closed validator fixtures
        shell: bash
        run: bash tests/agent-policy-validator.sh
