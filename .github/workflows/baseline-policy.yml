name: organization-baseline-policy

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Compile policy code
        run: python3 -m py_compile scripts/validate_baseline.py tests/test_validate_baseline.py
      - name: Run mutation tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate organization baseline
        run: python3 scripts/validate_baseline.py .
