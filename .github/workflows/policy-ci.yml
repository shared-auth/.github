name: Organization policy CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-auth-agent-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate policy, workflow pins, conflict markers, and credential patterns
        shell: bash
        run: bash scripts/validate-agent-policy.sh
      - name: Exercise fail-closed validator fixtures
        shell: bash
        run: bash tests/agent-policy-validator.sh
