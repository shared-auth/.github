name: Organization policy CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-auth-agent-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.7"
      - name: Validate policy, workflow pins, conflict markers, and credential patterns
        shell: bash
        run: bash scripts/validate-agent-policy.sh
      - name: Exercise fail-closed validator fixtures
        shell: bash
        run: bash tests/agent-policy-validator.sh
      - name: Exercise Shared Auth config authority regressions
        shell: bash
        run: python3 -m unittest scripts/test_audit_shared_auth_config_authority.py
      - name: Exercise Shared Auth runtime adoption regressions
        shell: bash
        run: python3 -m unittest scripts/test_audit_shared_auth_runtime_adoption.py
      - name: Exercise Shared Auth Cargo override regressions
        shell: bash
        run: python3 -m unittest scripts/test_audit_shared_auth_cargo_overrides.py
