name: Shared Auth runtime Zed lock generation

on:
  pull_request:
    paths:
      - .github/workflows/runtime-lock-generation.yml
      - config/runtime-zpkg-generation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-auth-runtime-zpkg-lock-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slug: [cli, customer-web, customer-api, admin-web, admin-api]
    env:
      ZED_PKG_INTERACTIVE: "false"
    steps:
      - name: Check out content-addressed generation inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Zed CLI v0.3.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zed.tar.gz"
          dir="$RUNNER_TEMP/zed-release"
          curl --fail --location --retry 3 --retry-all-errors \
            -o "$archive" \
            https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a \
            "$archive" | sha256sum --check --strict
          mkdir -p "$dir" "$HOME/.local/bin"
          tar -xzf "$archive" -C "$dir"
          zed_bin="$(find "$dir" -type f -name zed -perm -111 -print -quit)"
          test -n "$zed_bin"
          install -m 0755 "$zed_bin" "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate and freeze Zed lock
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/zpkg-${{ matrix.slug }}"
          mkdir -p "$work"
          cp "config/runtime-zpkg-generation/${{ matrix.slug }}.zpkg.toml" "$work/.zpkg.toml"
          cd "$work"
          zed --version
          zed validate
          zed install
          test -s .zpkg.lock
          zed validate --require-lock
          zed install --frozen
          mkdir -p "$GITHUB_WORKSPACE/out/${{ matrix.slug }}"
          cp .zpkg.lock "$GITHUB_WORKSPACE/out/${{ matrix.slug }}/.zpkg.lock"
          sha256sum .zpkg.toml .zpkg.lock > "$GITHUB_WORKSPACE/out/${{ matrix.slug }}/SHA256SUMS"

      - name: Upload generated Zed lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-auth-zpkg-lock-${{ matrix.slug }}
          path: out/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 7
